name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: public-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-public
        run: ./scripts/check-public.sh

  plugin:
    name: lint-build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maestro-cmux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maestro-cmux/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
